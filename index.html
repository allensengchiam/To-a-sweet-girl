<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      width: 320px;
      max-width: 90%;
    }

    h1 {
      color: #ff4d6d;
      margin-top: 0;
    }

    p {
      font-size: 20px;
    }

    h2 {
      font-size: 22px;
      line-height: 1.4;
    }

    button {
      border: none;
      padding: 15px 25px;
      margin: 10px 5px;
      border-radius: 20px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #eee;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>Hey ❤️</h1>

    <p>I have an important question...</p>

    <h2>
      Would you like to go to dinner with me at 6 PM? 🍝🌹
    </h2>

    <button id="yes" onclick="yesClicked()">
      YES ❤️
    </button>

    <button id="no" onclick="noClicked()">
      No 😭
    </button>
  </div>

  <script>
    let noClicks = 0;

    function yesClicked() {
      document.getElementById("card").innerHTML = `
        <h1>YAYYY ❤️</h1>
        <h2>Dinner at 6 PM it is! 🍝🌹</h2>
        <p>I'll see you then :)</p>
      `;
    }

    function noClicked() {
      const noButton = document.getElementById("no");

      noClicks++;

      const messages = [
        "Are you sure? 🥺",
        "Really? 😭",
        "Please? 🥹",
        "Think about it... ❤️",
        "One more chance? 🥺🌹"
      ];

      noButton.innerText =
        messages[Math.min(noClicks - 1, messages.length - 1)];
    }
  </script>

</body>
</html>
